<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modulo Utenti</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f9f9f9;
    }
    label, input, select, button {
      display: block;
      margin: 10px 0;
    }
    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    #messaggio {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Inserisci i tuoi dati</h2>

  <label for="nome">Nome:</label>
  <input type="text" id="nome" placeholder="Inserisci il tuo nome">

  <label for="sesso">Sesso:</label>
  <select id="sesso">
    <option value="">Seleziona M o F</option>
    <option value="M">M</option>
    <option value="F">F</option>
  </select>

  <label for="contatto">Contatto (email):</label>
  <input type="email" id="contatto" placeholder="Inserisci email">

  <button onclick="invia()">Invia</button>

  <p id="messaggio"></p>

  <script>
    function invia() {
      const nome = document.getElementById("nome").value.trim();
      const sesso = document.getElementById("sesso").value;
      const contatto = document.getElementById("contatto").value.trim();
      const messaggio = document.getElementById("messaggio");

      if (!nome || !sesso || !contatto) {
        messaggio.textContent = "Compila tutti i campi!";
        messaggio.style.color = "red";
        return;
      }

     fetch('https://script.google.com/macros/s/TUO_WEB_APP_ID/exec', {
  method: 'POST',
	mode: 'cors',
  headers: {
    'Content-Type': 'application/json',
  },
  body: JSON.stringify({
    nome: nome,
    sesso: sesso,
    contatto: contatto
  })
})
.then(res => res.text())
.then(data => {
  alert("Dati inviati con successo!");
})
.catch(err => {
  alert("Errore nell'invio dei dati: " + err);
});

    }
  </script>

</body>
</html>
